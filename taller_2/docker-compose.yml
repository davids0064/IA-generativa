name: ecomarket-ia

# Variables compartidas por `indexer` y `app` (misma imagen, mismo entorno).
x-entorno-app: &entorno-app
  LLM_BASE_URL: http://ollama:11434/v1
  LLM_API_KEY: ollama
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
  EMBEDDINGS_PROVIDER: ollama
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
  EMBEDDINGS_BASE_URL: http://ollama:11434
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"

services:
  # Servidor de inferencia con el modelo open-source.
  ollama:
    image: ollama/ollama:latest
    container_name: ecomarket-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Servicio de un solo uso: descarga el LLM y el modelo de embeddings la
  # primera vez y termina.
  model-loader:
    image: ollama/ollama:latest
    container_name: ecomarket-model-loader
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
    entrypoint:
      ["/bin/sh", "-c", "ollama pull \"$${LLM_MODEL}\" && ollama pull \"$${EMBEDDINGS_MODEL}\""]
    restart: "no"

  # Base de datos vectorial (ChromaDB en modo servidor). El índice vive en el
  # volumen `chroma-data`, así que sobrevive a reinicios y se carga una sola vez.
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: ecomarket-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Servicio de un solo uso: carga la base de conocimiento en ChromaDB y
  # termina. Si la colección ya tiene documentos no hace nada; para
  # reconstruirla: docker compose run --rm indexer --reindexar
  indexer:
    build: .
    # Nombre propio por taller: con uno compartido, `compose run` reutilizaba la
    # imagen del otro taller. `pull_policy: build` la reconstruye (con caché)
    # antes de usarla, para que nunca quede desactualizada frente a uv.lock.
    image: ecomarket-app-taller2
    pull_policy: build
    container_name: ecomarket-indexer
    depends_on:
      model-loader:
        condition: service_completed_successfully
      chroma:
        condition: service_healthy
    environment: *entorno-app
    entrypoint: ["python", "-m", "src.base_conocimiento"]
    command: []
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    restart: "no"

  # Aplicación del taller (CLI del agente: prompts del Taller 1 + RAG del Taller 2).
  # Solo consulta la base vectorial: la carga es responsabilidad de `indexer`.
  app:
    build: .
    # Nombre propio por taller: con uno compartido, `compose run` reutilizaba la
    # imagen del otro taller. `pull_policy: build` la reconstruye (con caché)
    # antes de usarla, para que nunca quede desactualizada frente a uv.lock.
    image: ecomarket-app-taller2
    pull_policy: build
    container_name: ecomarket-app
    depends_on:
      indexer:
        condition: service_completed_successfully
    environment: *entorno-app
    volumes:
      # Montados para poder editar prompts y dataset sin reconstruir la imagen.
      - ./src:/app/src
      - ./data:/app/data
    stdin_open: true
    tty: true

volumes:
  ollama-models:
  chroma-data:
