name: ecomarket-ia

# Variables compartidas por `indexer` y `app` (misma imagen, mismo entorno).
x-entorno-app: &entorno-app
  LLM_BASE_URL: http://ollama:11434/v1
  LLM_API_KEY: ollama
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
  EMBEDDINGS_PROVIDER: ollama
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
  EMBEDDINGS_BASE_URL: http://ollama:11434
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  # Proyecto Final: agente con herramientas
  AGENT_PROVIDER: ${AGENT_PROVIDER:-ollama}
  AGENT_MODEL: ${AGENT_MODEL:-qwen2.5:7b}
  AGENT_NUM_CTX: ${AGENT_NUM_CTX:-8192}
  AGENT_TIMEOUT: ${AGENT_TIMEOUT:-600}
  OLLAMA_BASE_URL: http://ollama:11434
  FECHA_REFERENCIA: ${FECHA_REFERENCIA:-2026-09-29}
  SIMULAR_FALLA_TRANSPORTADORA: ${SIMULAR_FALLA_TRANSPORTADORA:-false}

services:
  # Servidor de inferencia con el modelo open-source.
  ollama:
    image: ollama/ollama:latest
    container_name: ecomarket-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Servicio de un solo uso: descarga el LLM y el modelo de embeddings la
  # primera vez y termina.
  model-loader:
    image: ollama/ollama:latest
    container_name: ecomarket-model-loader
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-bge-m3}
      AGENT_MODEL: ${AGENT_MODEL:-qwen2.5:7b}
    entrypoint:
      ["/bin/sh", "-c", "ollama pull \"$${LLM_MODEL}\" && ollama pull \"$${EMBEDDINGS_MODEL}\" && ollama pull \"$${AGENT_MODEL}\""]
    restart: "no"

  # Base de datos vectorial (ChromaDB en modo servidor). El índice vive en el
  # volumen `chroma-data`, así que sobrevive a reinicios y se carga una sola vez.
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: ecomarket-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Servicio de un solo uso: carga la base de conocimiento en ChromaDB y
  # termina. Si la colección ya tiene documentos no hace nada; para
  # reconstruirla: docker compose run --rm indexer --reindexar
  indexer:
    build: .
    # Nombre propio por taller: con uno compartido, `compose run` reutilizaba la
    # imagen del otro taller. `pull_policy: build` la reconstruye (con caché)
    # antes de usarla, para que nunca quede desactualizada frente a uv.lock.
    image: ecomarket-app-proyecto-final
    pull_policy: build
    container_name: ecomarket-indexer
    depends_on:
      model-loader:
        condition: service_completed_successfully
      chroma:
        condition: service_healthy
    environment: *entorno-app
    entrypoint: ["python", "-m", "src.base_conocimiento"]
    command: []
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    restart: "no"

  # Aplicación (CLI): modos del Taller 1 y del Taller 2. El chat con el agente del
  # Proyecto Final se abre con:
  #   docker compose run --rm --entrypoint python app -m src.main_agente
  # Solo consulta la base vectorial: la carga es responsabilidad de `indexer`.
  app:
    build: .
    # Nombre propio por taller: con uno compartido, `compose run` reutilizaba la
    # imagen del otro taller. `pull_policy: build` la reconstruye (con caché)
    # antes de usarla, para que nunca quede desactualizada frente a uv.lock.
    image: ecomarket-app-proyecto-final
    pull_policy: build
    container_name: ecomarket-app
    depends_on:
      indexer:
        condition: service_completed_successfully
    environment: *entorno-app
    volumes:
      # Montados para poder editar prompts y dataset sin reconstruir la imagen.
      - ./src:/app/src
      - ./data:/app/data
    stdin_open: true
    tty: true

  # Interfaz web del agente (Proyecto Final, Fase 4): http://localhost:8501
  web:
    build: .
    image: ecomarket-app-proyecto-final
    pull_policy: build
    container_name: ecomarket-web
    depends_on:
      indexer:
        condition: service_completed_successfully
    environment: *entorno-app
    entrypoint: ["streamlit", "run", "src/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    command: []
    ports:
      - "8501:8501"
    volumes:
      # Devoluciones, tickets, etiquetas y auditoría persisten en el equipo anfitrión.
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  ollama-models:
  chroma-data:
